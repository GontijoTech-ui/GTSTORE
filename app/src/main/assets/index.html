<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTSTORE</title>
    <style>
        :root {
            --bg: #000000;
            --panel: #0d0d0d;
            --panel-card: #121212;
            --panel-card-hover: #181818;
            --border: #222222;
            --primary: #0070cc;
            --primary-hover: #0088f0;
            --text: #ffffff;
            --muted: #888888;
            --green: #35c759;
            --orange: #ff9f0a;
            --red: #ff453a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: var(--bg);
        }

        body {
            background-color: #000000;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button, input {
            font-family: inherit;
        }

        .header {
            width: 100%;
            background: #000000;
            border-bottom: 1px solid var(--border);
            padding: 24px 16px 20px;
            text-align: center;
        }

        /* LOGO AMPLIADA E CENTRALIZADA */
        .logo {
            display: block;
            width: 220px;
            max-width: 80%;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin: 0 auto 12px;
            border-radius: 12px;
        }

        /* BADGE DE STATUS ON / OFF */
        .server-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #141414;
            border: 1px solid #222;
            color: var(--muted);
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--orange);
            transition: background-color 0.3s ease;
        }

        .status-online {
            border-color: rgba(53, 199, 89, 0.3);
            color: #d1d1d1;
        }
        .status-online .status-dot {
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .status-offline {
            border-color: rgba(255, 69, 58, 0.4);
            color: #ff817a;
        }
        .status-offline .status-dot {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 0 60px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        .search {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 112, 204, 0.7);
        }

        .refresh {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 20px;
            background: #151515;
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            outline: none;
        }

        /* GRADE DE JOGOS */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            background: var(--panel-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .game-card:hover {
            border-color: #333333;
        }

        .cover-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #050505;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-placeholder {
            color: #555555;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        .game-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-top: 12px;
        }

        .game-title {
            margin: 0 0 4px;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            height: 38px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }

        .game-id {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-row {
            display: flex;
            gap: 6px;
        }

        .action {
            flex: 1;
            border: 0;
            border-radius: 6px;
            padding: 10px 4px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            text-align: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .action-update { background: #2f5379; }
        .action-dlc { background: #633994; }
        .action-patch { background: #875416; }

        /* Foco via controle D-Pad do PS4 */
        .action:focus,
        .action:hover,
        .refresh:focus,
        .refresh:hover,
        .send-button:focus,
        .send-button:hover,
        .close:focus,
        .close:hover {
            outline: 3px solid #ffffff !important;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.9) !important;
            transform: scale(1.04);
            z-index: 5;
        }

        .action:disabled,
        .send-button:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none !important;
            box-shadow: none !important;
        }

        .package-info {
            margin-top: 8px;
            color: #666666;
            font-size: 11px;
            text-align: center;
        }

        .empty, .loading, .error {
            grid-column: 1 / -1;
            background: #0d0d0d;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 35px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
        }

        .error { color: #ff817a; }

        .footer {
            padding: 30px 10px;
            text-align: center;
            color: #333333;
            font-size: 11px;
        }

        /* MODAL DE DLC / UPDATES */
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
        }

        .overlay.visible { display: flex; }

        .modal {
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow: auto;
            background: #111111;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .modal-title { margin: 0; font-size: 18px; }

        .close {
            border: 0;
            background: #222222;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            outline: none;
        }

        .dlc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dlc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #161616;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .dlc-name { flex: 1; min-width: 0; }
        .dlc-title { margin: 0 0 4px; font-size: 14px; word-break: break-word; }
        .dlc-meta { margin: 0; color: var(--muted); font-size: 11px; }

        .send-button {
            flex-shrink: 0;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            padding: 9px 15px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .notice {
            display: none;
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 8px;
            background: #161616;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            border-left: 4px solid var(--primary);
            white-space: pre-line;
        }

        .notice.visible { display: block; }
        .notice.error { border-left-color: var(--red); background: #261012; color: #ff817a; }
        .notice.success { border-left-color: var(--green); background: #0e2013; color: #4cd964; }
    </style>
</head>
<body>

<header class="header">
    <img class="logo" src="/logo.jpg" alt="Logo" onerror="this.style.display='none';">
    <div id="server-status" class="server-status">
        <span class="status-dot"></span>
        <span id="server-status-text">A verificar servidor...</span>
    </div>
</header>

<main class="container">
    <div class="toolbar">
        <input id="search" class="search" type="text" placeholder="Pesquisar por nome ou CUSA..." autocomplete="off">
        <button id="refresh" class="refresh" type="button">Atualizar</button>
    </div>
    <div id="notice" class="notice"></div>
    <section id="catalog" class="catalog">
        <div class="loading">Carregando catálogo...</div>
    </section>
</main>

<footer class="footer"></footer>

<div id="dlc-overlay" class="overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="dlc-modal-title" class="modal-title">DLC</h2>
            <button id="dlc-close" class="close" type="button">×</button>
        </div>
        <div id="dlc-list" class="dlc-list"></div>
    </div>
</div>

<script>
"use strict";

let allPackages = [];
let games = [];
let ps4ClientIp = "";
let isServerOnline = false;

function formatSize(bytes) {
    const value = Number(bytes);
    if (!Number.isFinite(value) || value < 0) return "Tamanho desconhecido";
    if (value < 1024) return value + " B";
    if (value < 1024 * 1024) return (value / 1024).toFixed(2) + " KB";
    if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(2) + " MB";
    return (value / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}

async function checkStatus() {
    const badge = document.getElementById("server-status");
    const text = document.getElementById("server-status-text");

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2500);

    try {
        const response = await fetch("/api/status", {
            cache: "no-store",
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();

        const wasOffline = !isServerOnline;
        isServerOnline = true;

        badge.className = "server-status status-online";
        const ip = data.localAddress || data.address || data.local_address || "";
        ps4ClientIp = data.clientIp || "";
        text.textContent = "Servidor Online — " + (ip ? ip + ":" + data.port : "Porta " + data.port);

        if (wasOffline && allPackages.length === 0) {
            loadPackages();
        }
    } catch (error) {
        clearTimeout(timeoutId);
        isServerOnline = false;
        badge.className = "server-status status-offline";
        text.textContent = "Servidor Offline (Desconectado)";
    }
}

function normalizeType(pkg) {
    const type = String(pkg.catalogType || pkg.type || "").toUpperCase();
    if (type === "GAME") return "GAME";
    if (type === "UPDATE") return "UPDATE";
    if (type === "DLC") return "DLC";
    if (type === "PATCH") return "PATCH";
    return "OTHER";
}

function groupKey(pkg) {
    const contentId = String(pkg.contentId || "").trim().toUpperCase();
    if (contentId) {
        const match = contentId.match(/CUSA\d+/i);
        if (match) return match[0].toUpperCase();
        const prefix = contentId.split("_00-")[0];
        if (prefix) return prefix;
    }
    return (pkg.title || pkg.name || ("PKG_" + pkg.id)).trim().toUpperCase();
}

function packageIcon(pkg) {
    if (pkg.iconUrl) return pkg.iconUrl;
    if (pkg.icon) {
        const icon = String(pkg.icon);
        return icon.startsWith("data:") ? icon : "data:image/png;base64," + icon;
    }
    return null;
}

function buildCatalog(packages) {
    const groups = new Map();

    for (const pkg of packages) {
        const type = normalizeType(pkg);
        const key = groupKey(pkg);

        if (!groups.has(key)) {
            groups.set(key, {
                key: key,
                title: "",
                cover: null,
                game: null,
                updates: [],
                dlcs: [],
                patches: []
            });
        }

        const game = groups.get(key);
        const title = String(pkg.title || pkg.name || "").trim();

        if (type === "GAME") {
            game.title = title;
            if (!game.game) game.game = pkg;
        } else if (!game.title && title) {
            game.title = title;
        }

        const icon = packageIcon(pkg);
        if (type === "GAME" && icon) {
            game.cover = icon;
        } else if (!game.cover && icon) {
            game.cover = icon;
        }

        if (type === "UPDATE") {
            game.updates.push(pkg);
        } else if (type === "DLC") {
            game.dlcs.push(pkg);
        } else if (type === "PATCH") {
            game.patches.push(pkg);
        } else if (type !== "GAME") {
            if (!game.game) game.game = pkg;
        }
    }

    const result = Array.from(groups.values());
    result.sort((a, b) => a.title.localeCompare(b.title, "pt-BR", { sensitivity: "base" }));
    return result;
}

async function sendPackage(pkg, button) {
    if (!isServerOnline) {
        showNotice("✗ Servidor Offline! Ligue o servidor no celular antes de instalar.", "error");
        return;
    }

    button.disabled = true;
    const original = button.textContent;
    button.textContent = "...";
    showNotice("A enviar payload ao PS4 (Porta 9090)...");

    try {
        const response = await fetch("/api/install-dpi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                pkgId: pkg.id,
                ip: ps4ClientIp
            })
        });

        const result = await response.json();

        if (result.success) {
            button.textContent = "OK!";
            showNotice("✓ " + (result.message || "Instalação iniciada! Verifique o console."), "success");
        } else {
            button.textContent = "Erro";
            showNotice("✗ " + (result.error || "Erro ao acionar BinLoader."), "error");
        }
    } catch (err) {
        button.textContent = "Falha";
        showNotice("✗ Falha de comunicação com o servidor Android: " + err.message, "error");
    } finally {
        setTimeout(() => {
            button.disabled = false;
            button.textContent = original;
        }, 5000);
    }
}

function openDlc(game) {
    openPackageList("DLC — " + game.title, game.dlcs);
}

function closeDlc() {
    document.getElementById("dlc-overlay").classList.remove("visible");
}

function openPackageList(titleText, packages) {
    const overlay = document.getElementById("dlc-overlay");
    const title = document.getElementById("dlc-modal-title");
    const list = document.getElementById("dlc-list");

    title.textContent = titleText;
    list.innerHTML = "";

    if (!packages.length) {
        list.innerHTML = '<div class="empty">Nenhum pacote disponível.</div>';
    } else {
        for (const pkg of packages) {
            const item = document.createElement("div");
            item.className = "dlc-item";

            const info = document.createElement("div");
            info.className = "dlc-name";

            const name = document.createElement("p");
            name.className = "dlc-title";
            name.textContent = pkg.title || pkg.name || "PKG";

            const meta = document.createElement("p");
            meta.className = "dlc-meta";
            meta.textContent = String(pkg.contentId || "") + " • " + formatSize(pkg.size);

            info.appendChild(name);
            info.appendChild(meta);

            const button = document.createElement("button");
            button.className = "send-button";
            button.type = "button";
            button.textContent = "INSTALAR";
            button.onclick = () => sendPackage(pkg, button);

            item.appendChild(info);
            item.appendChild(button);
            list.appendChild(item);
        }
    }
    overlay.classList.add("visible");
}

function renderCatalog() {
    const container = document.getElementById("catalog");
    const query = document.getElementById("search").value.trim().toLowerCase();

    const filtered = games.filter(g => {
        if (!query) return true;
        const matchesTitle = g.title.toLowerCase().includes(query);
        const matchesKey = g.key.toLowerCase().includes(query);
        return matchesTitle || matchesKey;
    });

    container.innerHTML = "";

    if (!filtered.length) {
        container.innerHTML = '<div class="empty">Nenhum jogo encontrado para a busca.</div>';
        return;
    }

    for (const game of filtered) {
        const card = document.createElement("article");
        card.className = "game-card";

        const coverWrap = document.createElement("div");
        coverWrap.className = "cover-wrap";

        if (game.cover) {
            const image = document.createElement("img");
            image.className = "cover";
            image.src = game.cover;
            image.alt = game.title;
            image.loading = "lazy";
            coverWrap.appendChild(image);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "cover-placeholder";
            placeholder.textContent = game.key || "SEM CAPA";
            coverWrap.appendChild(placeholder);
        }

        const content = document.createElement("div");
        content.className = "game-content";

        const title = document.createElement("h2");
        title.className = "game-title";
        title.textContent = game.title || "Jogo";
        title.title = game.title;

        const id = document.createElement("p");
        id.className = "game-id";
        id.textContent = game.key;

        const actions = document.createElement("div");
        actions.className = "actions";

        const mainRow = document.createElement("div");
        mainRow.className = "action-row";

        if (game.game) {
            const btn = document.createElement("button");
            btn.className = "action";
            btn.type = "button";
            btn.textContent = "GAME";
            btn.onclick = () => sendPackage(game.game, btn);
            mainRow.appendChild(btn);
        }

        if (game.updates.length) {
            const btn = document.createElement("button");
            btn.className = "action action-update";
            btn.type = "button";
            btn.textContent = game.updates.length > 1 ? "UPD (" + game.updates.length + ")" : "UPDATE";
            btn.onclick = () => {
                if (game.updates.length === 1) sendPackage(game.updates[0], btn);
                else openPackageList("UPDATE — " + game.title, game.updates);
            };
            mainRow.appendChild(btn);
        }

        if (mainRow.children.length > 0) {
            actions.appendChild(mainRow);
        }

        const secRow = document.createElement("div");
        secRow.className = "action-row";

        if (game.dlcs.length) {
            const btn = document.createElement("button");
            btn.className = "action action-dlc";
            btn.type = "button";
            btn.textContent = "DLC (" + game.dlcs.length + ")";
            btn.onclick = () => openDlc(game);
            secRow.appendChild(btn);
        }

        if (game.patches.length) {
            const btn = document.createElement("button");
            btn.className = "action action-patch";
            btn.type = "button";
            btn.textContent = game.patches.length > 1 ? "PATCH (" + game.patches.length + ")" : "PATCH";
            btn.onclick = () => {
                if (game.patches.length === 1) sendPackage(game.patches[0], btn);
                else openPackageList("PATCH — " + game.title, game.patches);
            };
            secRow.appendChild(btn);
        }

        if (secRow.children.length > 0) {
            actions.appendChild(secRow);
        }

        const info = document.createElement("div");
        info.className = "package-info";
        if (game.game) {
            info.textContent = formatSize(game.game.size);
        }

        content.appendChild(title);
        content.appendChild(id);
        content.appendChild(actions);
        content.appendChild(info);

        card.appendChild(coverWrap);
        card.appendChild(content);
        container.appendChild(card);
    }
}

async function loadPackages() {
    const container = document.getElementById("catalog");
    container.innerHTML = '<div class="loading">Carregando catálogo...</div>';

    try {
        const response = await fetch("/api/packages", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();

        allPackages = Array.isArray(data) ? data : (Array.isArray(data.packages) ? data.packages : []);
        games = buildCatalog(allPackages);
        renderCatalog();
    } catch (error) {
        console.error("Erro ao carregar catálogo:", error);
        container.innerHTML = '<div class="error">Não foi possível carregar o catálogo.</div>';
    }
}

function showNotice(message, type = "") {
    const notice = document.getElementById("notice");
    notice.textContent = message;
    notice.className = "notice visible" + (type ? " " + type : "");
    setTimeout(() => {
        notice.classList.remove("visible");
    }, 7000);
}

const searchInput = document.getElementById("search");
searchInput.addEventListener("input", renderCatalog);
searchInput.addEventListener("keyup", renderCatalog);
searchInput.addEventListener("change", renderCatalog);

document.getElementById("refresh").addEventListener("click", async () => {
    await checkStatus();
    await loadPackages();
});

document.getElementById("dlc-close").addEventListener("click", closeDlc);
document.getElementById("dlc-overlay").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closeDlc();
});

document.addEventListener("DOMContentLoaded", async () => {
    await checkStatus();
    await loadPackages();
    setInterval(checkStatus, 4000);
});
</script>
</body>
</html>
