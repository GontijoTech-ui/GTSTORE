<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTSTORE - PS4 Store</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 25px; background: #101114; color: #fff; font-family: Arial, Helvetica, sans-serif; }
        .container { max-width: 1000px; margin: auto; }
        h1 { margin-top: 0; font-size: 36px; color: #0070d1; }
        .subtitle { color: #999; margin-bottom: 25px; font-size: 18px; }
        
        .header-status { background: #1b1d22; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #292c33; display: flex; justify-content: space-between; align-items: center;}
        .online { color: #4caf50; font-weight: bold; }
        .offline { color: #f44336; font-weight: bold; }
        
        /* Grid da Loja */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-card { background: #1b1d22; border-radius: 10px; padding: 20px; border: 1px solid #333840; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .game-card:hover { transform: scale(1.02); border-color: #0070d1; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; word-wrap: break-word; }
        .game-size { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        
        button { width: 100%; padding: 16px; border: 0; border-radius: 8px; background: #0070d1; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; color: #999; cursor: not-allowed; }
        button:focus { outline: 3px solid #fff; }

        #log { min-height: 150px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; background: #08090b; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; color: #00ff66; margin-top: 20px;}
        
        .success { color: #00ff66; }
        .error { color: #ff5252; }
        .warning { color: #ffca28; }
        .info { color: #61dafb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GTSTORE</h1>
        <div class="subtitle">A sua Loja Local de PKGs</div>
        
        <div class="header-status">
            <div>
                <strong>Servidor:</strong> <span id="serverStatus" class="offline">OFFLINE</span>
            </div>
            <div>
                <strong>A sua PS4 (IP Detetado):</strong> <span id="ps4ipDisplay" style="color: #61dafb;">A identificar...</span>
            </div>
        </div>

        <div id="store-grid" class="store-grid">
            <h3 style="color: #999;">A carregar a lista de jogos...</h3>
        </div>

        <div>
            <h2>Consola de Operações</h2>
            <div id="log">
> Bem-vindo à GTSTORE.
> Aguardando seleção de jogo...
            </div>
        </div>
    </div>

    <script>
        let ps4IpGlobal = "";

        function log(message, type) {
            const logDiv = document.getElementById("log");
            let prefix = "> ";
            if(type === 'error') prefix = "[ERRO] ";
            if(type === 'success') prefix = "[OK] ";
            logDiv.innerHTML += `<br><span class="${type || 'info'}">${prefix}${message}</span>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function getServerBaseUrl() { 
            return window.location.origin; 
        }

        /* 
         * SOLUÇÃO PARA A PS4: 
         * Wrapper usando XMLHttpRequest, 100% compatível com o navegador WebKit antigo da PS4
         */
        function apiCall(path, method = "GET", bodyObj = null) {
            return new Promise(function(resolve, reject) {
                const xhr = new XMLHttpRequest();
                const url = getServerBaseUrl() + path + (method === "GET" ? "?t=" + new Date().getTime() : "");
                
                xhr.open(method, url, true);
                
                if (method === "POST") {
                    xhr.setRequestHeader("Content-Type", "application/json");
                }
                
                xhr.onload = function() {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        resolve({ ok: xhr.status >= 200 && xhr.status < 300, data: data });
                    } catch (e) {
                        reject(new Error("Resposta inválida do servidor."));
                    }
                };
                
                xhr.onerror = function() {
                    reject(new Error("A conexão ao telemóvel falhou ou foi bloqueada."));
                };
                
                xhr.send(bodyObj ? JSON.stringify(bodyObj) : null);
            });
        }

        async function carregarStatus() {
            try {
                const res = await apiCall("/api/status");
                const data = res.data;
                
                const statusEl = document.getElementById("serverStatus");
                statusEl.innerText = data.online ? "ONLINE" : "OFFLINE";
                statusEl.className = data.online ? "online" : "offline";
                
                if(data.clientIp) {
                    let ip = data.clientIp;
                    // Limpa o IP caso o Android devolva um formato IPv6 mapeado (ex: ::ffff:192.168.1.10)
                    if(ip.indexOf("::ffff:") === 0) {
                        ip = ip.substring(7);
                    }
                    ps4IpGlobal = ip;
                    document.getElementById("ps4ipDisplay").innerText = ps4IpGlobal;
                }
            } catch (error) {
                document.getElementById("serverStatus").innerText = "OFFLINE";
                document.getElementById("serverStatus").className = "offline";
            }
        }

        async function carregarPackages() {
            try {
                const res = await apiCall("/api/packages");
                const packages = res.data.packages || [];
                const grid = document.getElementById("store-grid");
                
                grid.innerHTML = "";
                
                if (packages.length === 0) {
                    grid.innerHTML = "<h3 style='color: #ffca28;'>Nenhum ficheiro .pkg encontrado na pasta selecionada.</h3>";
                    return;
                }
                
                packages.forEach(function(pkg) {
                    const pkgUrl = getServerBaseUrl() + pkg.url;
                    const card = document.createElement("div");
                    card.className = "game-card";
                    card.innerHTML = `
                        <div>
                            <div class="game-title">${escapeHtml(pkg.name)}</div>
                            <div class="game-size">Tamanho: ${escapeHtml(pkg.formattedSize)}</div>
                        </div>
                        <button id="btn-${pkg.id}" onclick="iniciarInstalacaoDireta('${pkgUrl}', '${escapeHtml(pkg.name)}', 'btn-${pkg.id}')">Transferir para a PS4</button>
                    `;
                    grid.appendChild(card);
                });
                
            } catch (error) {
                document.getElementById("store-grid").innerHTML = "<h3 class='error'>Erro ao comunicar com o telemóvel.</h3>";
            }
        }

        async function enviarPayload() {
            log("Injetando RPI Payload na porta 9090...", "info");
            try {
                const res = await apiCall("/api/send-payload", "POST", { ip: ps4IpGlobal, payloadName: "rpi_installer.bin" });
                if (!res.ok || !res.data.success) {
                    log("Injeção falhou: " + (res.data.error || "Desconhecido"), "error");
                    return false;
                }
                log("Payload ativado com sucesso!", "success");
                return true;
            } catch (error) {
                log("Erro de rede na injeção: " + error.message, "error");
                return false;
            }
        }

        async function registrarPkg(pkgUrl) {
            log("Enviando ordem de transferência para a porta 12800...", "info");
            try {
                const res = await apiCall("/api/install", "POST", { ip: ps4IpGlobal, pkgUrl: pkgUrl });
                if (!res.ok || !res.data.success) {
                    log("Ordem recusada pela PS4: " + (res.data.error || "Desconhecido"), "error");
                    return false;
                }
                log("A PS4 aceitou o jogo! Verifique as Notificações de Transferência no menu principal.", "success");
                return true;
            } catch (error) {
                log("A PS4 não respondeu na porta 12800. O RPI está ativo?", "error");
                return false;
            }
        }

        async function iniciarInstalacaoDireta(pkgUrl, pkgName, buttonId) {
            if (!ps4IpGlobal) { 
                alert("Ainda a identificar o IP da PS4. Aguarde uns segundos e verifique se aparece no topo."); 
                return; 
            }
            
            const btn = document.getElementById(buttonId);
            btn.disabled = true;
            btn.innerText = "A Iniciar...";
            
            log("--------------------------------", "info");
            log(`Preparando instalação: ${pkgName}`, "info");
            
            const payloadOk = await enviarPayload();
            if (!payloadOk) {
                log("Processo abortado.", "error");
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
                return;
            }
            
            // Pausa de 1,5s para garantir que o payload BinLoader assenta a porta 12800
            await new Promise(function(resolve) { setTimeout(resolve, 1500); });
            
            const pkgOk = await registrarPkg(pkgUrl);
            
            if (pkgOk) {
                btn.innerText = "A Transferir...";
                btn.style.background = "#4caf50";
            } else {
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        window.addEventListener("load", function() {
            carregarStatus();
            carregarPackages();
            setInterval(carregarStatus, 3000);
        });
    </script>
</body>
</html>
