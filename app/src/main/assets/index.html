<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTSTORE - PS4 Store</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 25px; background: #101114; color: #fff; font-family: Arial, Helvetica, sans-serif; }
        .container { max-width: 1000px; margin: auto; }
        h1 { margin-top: 0; font-size: 36px; color: #0070d1; }
        .subtitle { color: #999; margin-bottom: 25px; font-size: 18px; }
        
        .header-status { background: #1b1d22; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #292c33; display: flex; justify-content: space-between; align-items: center;}
        .online { color: #4caf50; font-weight: bold; }
        .offline { color: #f44336; font-weight: bold; }
        
        /* Grid da Loja */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-card { background: #1b1d22; border-radius: 10px; padding: 20px; border: 1px solid #333840; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .game-card:hover { transform: scale(1.02); border-color: #0070d1; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; word-wrap: break-word; }
        .game-size { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        
        button { width: 100%; padding: 16px; border: 0; border-radius: 8px; background: #0070d1; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; color: #999; cursor: not-allowed; }
        button:focus { outline: 3px solid #fff; }

        #log { min-height: 150px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; background: #08090b; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; color: #00ff66; margin-top: 20px;}
        
        .success { color: #00ff66; }
        .error { color: #ff5252; }
        .warning { color: #ffca28; }
        .info { color: #61dafb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GTSTORE</h1>
        <div class="subtitle">A sua Loja Local de PKGs</div>
        
        <div class="header-status">
            <div>
                <strong>Servidor:</strong> <span id="serverStatus" class="offline">OFFLINE</span>
            </div>
            <div>
                <strong>A sua PS4 (IP Detetado):</strong> <span id="ps4ipDisplay" style="color: #61dafb;">A identificar...</span>
            </div>
        </div>

        <div id="store-grid" class="store-grid">
            <h3 style="color: #999;">A carregar a lista de jogos...</h3>
        </div>

        <div>
            <h2>Consola de Operações</h2>
            <div id="log">
> Bem-vindo à GTSTORE.
> Aguardando seleção de jogo...
            </div>
        </div>
    </div>

    <script>
        var ps4IpGlobal = "";
        var packagesList = [];

        function log(message, type) {
            var logDiv = document.getElementById("log");
            var prefix = "> ";
            if(type === 'error') prefix = "[ERRO] ";
            if(type === 'success') prefix = "[OK] ";
            
            var msgType = type ? type : 'info';
            logDiv.innerHTML += "<br><span class='" + msgType + "'>" + prefix + message + "</span>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function getServerBaseUrl() { 
            return window.location.origin; 
        }

        /* 
         * XHR Seguro para PS4 Antigo
         */
        function apiCall(path, method, bodyObj, onSuccess, onError) {
            var xhr = new XMLHttpRequest();
            var url = getServerBaseUrl() + path + (method === "GET" ? "?t=" + new Date().getTime() : "");
            
            xhr.open(method, url, true);
            if (method === "POST") {
                xhr.setRequestHeader("Content-Type", "application/json");
            }
            
            xhr.onload = function() {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (xhr.status >= 200 && xhr.status < 300) {
                        if (onSuccess) onSuccess(data);
                    } else {
                        if (onError) onError(data.error || "Erro " + xhr.status);
                    }
                } catch (e) {
                    if (onError) onError("Resposta inválida do servidor.");
                }
            };
            
            xhr.onerror = function() {
                if (onError) onError("Falha de conexão com o Android.");
            };
            
            xhr.send(bodyObj ? JSON.stringify(bodyObj) : null);
        }

        function carregarStatus() {
            apiCall("/api/status", "GET", null, function(data) {
                var statusEl = document.getElementById("serverStatus");
                statusEl.innerText = data.online ? "ONLINE" : "OFFLINE";
                statusEl.className = data.online ? "online" : "offline";
                
                if(data.clientIp) {
                    var ip = data.clientIp;
                    if(ip.indexOf("::ffff:") === 0) {
                        ip = ip.substring(7);
                    }
                    ps4IpGlobal = ip;
                    document.getElementById("ps4ipDisplay").innerText = ps4IpGlobal;
                }
            }, function(err) {
                document.getElementById("serverStatus").innerText = "OFFLINE";
                document.getElementById("serverStatus").className = "offline";
            });
        }

        function carregarPackages() {
            apiCall("/api/packages", "GET", null, function(data) {
                packagesList = data.packages || [];
                var grid = document.getElementById("store-grid");
                grid.innerHTML = "";
                
                if (packagesList.length === 0) {
                    grid.innerHTML = "<h3 style='color: #ffca28;'>Nenhum ficheiro .pkg encontrado.</h3>";
                    return;
                }
                
                for(var i = 0; i < packagesList.length; i++) {
                    var pkg = packagesList[i];
                    var pkgUrl = getServerBaseUrl() + pkg.url;
                    var card = document.createElement("div");
                    card.className = "game-card";
                    card.innerHTML = "<div>" +
                                     "<div class='game-title'>" + escapeHtml(pkg.name) + "</div>" +
                                     "<div class='game-size'>Tamanho: " + escapeHtml(pkg.formattedSize) + "</div>" +
                                     "</div>" +
                                     "<button id='btn-" + pkg.id + "' onclick='iniciarInstalacaoDireta(\"" + pkgUrl + "\", \"" + escapeHtml(pkg.name) + "\", \"btn-" + pkg.id + "\")'>Transferir para a PS4</button>";
                    grid.appendChild(card);
                }
            }, function(err) {
                document.getElementById("store-grid").innerHTML = "<h3 class='error'>Erro ao comunicar com o telemóvel. O Servidor está iniciado?</h3>";
            });
        }

        function iniciarInstalacaoDireta(pkgUrl, pkgName, buttonId) {
            if (!ps4IpGlobal) { 
                alert("Ainda a identificar o IP da PS4. Aguarde uns segundos."); 
                return; 
            }
            
            var btn = document.getElementById(buttonId);
            btn.disabled = true;
            btn.innerText = "A Iniciar...";
            
            log("--------------------------------", "info");
            log("Preparando instalação: " + pkgName, "info");
            log("Injetando RPI Payload na porta 9090...", "info");
            
            // Passo 1: Enviar Payload
            apiCall("/api/send-payload", "POST", { ip: ps4IpGlobal, payloadName: "rpi_installer.bin" }, 
                function(dataPayload) {
                    log("Payload ativado com sucesso!", "success");
                    
                    // Passo 2: Aguardar 1.5s para o Payload fixar na memória do PS4
                    setTimeout(function() {
                        log("Enviando ordem de transferência para a porta 12800...", "info");
                        
                        // Passo 3: Iniciar Transferência
                        apiCall("/api/install", "POST", { ip: ps4IpGlobal, pkgUrl: pkgUrl },
                            function(dataInstall) {
                                log("A PS4 aceitou o jogo! Verifique as Notificações de Transferência.", "success");
                                btn.innerText = "A Transferir...";
                                btn.style.background = "#4caf50";
                            },
                            function(errInstall) {
                                log("A PS4 não respondeu na porta 12800. O RPI está ativo?", "error");
                                btn.disabled = false;
                                btn.innerText = "Tentar Novamente";
                            }
                        );
                        
                    }, 1500);
                },
                function(errPayload) {
                    log("Injeção falhou: " + errPayload, "error");
                    btn.disabled = false;
                    btn.innerText = "Tentar Novamente";
                }
            );
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        window.addEventListener("load", function() {
            carregarStatus();
            carregarPackages();
            setInterval(carregarStatus, 3000);
        });
    </script>
</body>
</html>
