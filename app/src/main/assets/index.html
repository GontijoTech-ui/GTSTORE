<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTStore - PS4 Installer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #0070cc;
            --primary-hover: #005bb5;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #e53935;
            --success: #4caf50;
            --warning: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        .config-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .input-group label {
            font-weight: bold;
            white-space: nowrap;
        }

        .input-group input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            flex-grow: 1;
        }

        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #333;
            text-align: center;
        }

        .status-online { background-color: var(--success) !important; }
        .status-offline { background-color: var(--danger) !important; }
        .status-scanning { background-color: var(--warning) !important; color: #000; }

        .btn-scan {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-scan:hover { background-color: #555; }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .pkg-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .pkg-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .pkg-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        .pkg-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>GTSTORE</h1>
    </header>

    <div class="container">
        <div class="config-panel">
            <div class="config-row">
                <div class="input-group">
                    <label for="ps4-ip">IP do PS4:</label>
                    <input type="text" id="ps4-ip" placeholder="A detetar automaticamente...">
                </div>
                <button class="btn-scan" onclick="autoDetectPs4Ip()">🔍 Procurar IP</button>
            </div>
            <div id="status-indicator" class="status-badge">A verificar servidor Android...</div>
        </div>

        <div id="pkg-container" class="pkg-list">
            <p style="text-align: center; color: #aaa;">A carregar pacotes...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Recupera IP guardado anteriormente
            const savedIp = localStorage.getItem('gtstore_ps4_ip');
            if (savedIp) {
                document.getElementById('ps4-ip').value = savedIp;
            } else {
                autoDetectPs4Ip(); // Tenta detetar ao abrir se não houver salvo
            }

            checkStatus();
            loadPackages();
        });

        async function checkStatus() {
            const indicator = document.getElementById('status-indicator');
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.online) {
                    indicator.textContent = 'Servidor Android Online (' + data.localAddress + ':' + data.port + ')';
                    indicator.className = 'status-badge status-online';
                }
            } catch (e) {
                indicator.textContent = 'Servidor Android Offline';
                indicator.className = 'status-badge status-offline';
            }
        }

        async function loadPackages() {
            const container = document.getElementById('pkg-container');
            try {
                const res = await fetch('/api/packages');
                const data = await res.json();
                
                container.innerHTML = '';
                
                if (data.count === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #aaa;">Nenhum PKG encontrado na pasta selecionada no Android.</p>';
                    return;
                }

                data.packages.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = 'pkg-card';
                    card.innerHTML = `
                        <div class="pkg-info">
                            <h3>${pkg.name}</h3>
                            <p>Tamanho: ${pkg.formattedSize}</p>
                        </div>
                        <button class="btn" id="btn-${pkg.id}" onclick="installDPI(${pkg.id})">Instalar no PS4</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: #e53935;">Erro ao carregar a lista de pacotes.</p>';
            }
        }

        // --- SISTEMA DE RECONHECIMENTO AUTOMÁTICO DO IP DO PS4 ---
        async function autoDetectPs4Ip() {
            const ipInput = document.getElementById('ps4-ip');
            const indicator = document.getElementById('status-indicator');
            
            // Se o navegador foi aberto no próprio PS4, o IP do cliente é o do PS4!
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.clientIp && data.clientIp !== "127.0.0.1" && data.clientIp !== data.localAddress) {
                    ipInput.value = data.clientIp;
                    localStorage.setItem('gtstore_ps4_ip', data.clientIp);
                    return;
                }
            } catch (e) {}

            // Caso contrário, tenta descobrir o gateway/sub-rede com base no IP do telemóvel
            indicator.textContent = 'A procurar PS4 na rede local...';
            indicator.className = 'status-badge status-scanning';

            try {
                const statusRes = await fetch('/api/status');
                const statusData = await statusRes.json();
                const androidIp = statusData.localAddress; // Ex: 192.168.1.15

                if (!androidIp || androidIp === '0.0.0.0') {
                    indicator.className = 'status-badge status-online';
                    return;
                }

                const subnet = androidIp.substring(0, androidIp.lastIndexOf('.') + 1);
                
                // IPs comuns de PS4 na rede doméstica para testar rapidamente em paralelo
                const commonHosts = [50, 100, 101, 102, 103, 104, 105, 110, 150, 200];
                let found = false;

                for (let host of commonHosts) {
                    const testIp = subnet + host;
                    if (testIp === androidIp) continue;

                    try {
                        // Tenta testar a porta do BinLoader (9090) do PS4 usando um pedido rápido de imagem/fetch com timeout curto
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 400);

                        await fetch(`http://${testIp}:9090`, { mode: 'no-cors', signal: controller.signal });
                        clearTimeout(timeoutId);

                        // Se respondeu ou rejeitou por CORS mas abriu ligação, encontramos o PS4!
                        ipInput.value = testIp;
                        localStorage.setItem('gtstore_ps4_ip', testIp);
                        found = true;
                        break;
                    } catch (err) {
                        // Continua a procurar
                    }
                }

                if (found) {
                    indicator.textContent = 'PS4 detetado com sucesso!';
                    indicator.className = 'status-badge status-online';
                } else {
                    indicator.textContent = 'PS4 não detetado automaticamente. Insira o IP manualmente.';
                    indicator.className = 'status-badge status-online';
                }
            } catch (e) {
                indicator.textContent = 'Servidor Android Online';
                indicator.className = 'status-badge status-online';
            }
        }

                async function installDPI(pkgId) {
            const ipInput = document.getElementById('ps4-ip').value.trim();
            
            if (!ipInput) {
                alert('AVISO: Por favor, insira o IP do seu PS4.');
                document.getElementById('ps4-ip').focus();
                return;
            }

            localStorage.setItem('gtstore_ps4_ip', ipInput);

            const btn = document.getElementById(`btn-${pkgId}`);
            const originalText = btn.textContent;
            btn.textContent = 'A injetar...';
            btn.disabled = true;

            try {
                // Mudamos para POST com cabeçalhos simplificados para o navegador do PS4 não recusar
                const res = await fetch('/api/install-dpi', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ipInput, pkgId: pkgId })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert('✅ SUCESSO!\n\n' + data.message);
                    btn.textContent = 'Enviado ✔️';
                } else {
                    alert('❌ ERRO DO SERVIDOR\n\n' + data.error);
                    btn.textContent = 'Falhou';
                }
            } catch (e) {
                alert('⚠️ ERRO DE REDE NO PS4\n\nDetalhe: ' + e.message + '\n\nDica: Certifique-se de que o BinLoader (porta 9090) está ativo no GoldHEN.');
                btn.textContent = 'Erro';
            } finally {
                if(btn.textContent !== 'Enviado ✔️') {
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 3000);
                }
            }
        }

    </script>
</body>
</html>
