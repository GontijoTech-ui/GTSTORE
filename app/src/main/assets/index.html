<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTStore - PS4 Installer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #0070cc;
            --primary-hover: #005bb5;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #e53935;
            --success: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        .config-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .input-group label {
            font-weight: bold;
        }

        .input-group input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            flex-grow: 1;
        }

        #status-indicator {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #333;
        }

        .status-online { background-color: var(--success) !important; }
        .status-offline { background-color: var(--danger) !important; }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pkg-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .pkg-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .pkg-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        .pkg-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <h1>GTSTORE</h1>
    </header>

    <div class="container">
        <div class="config-panel">
            <div class="input-group">
                <label for="ps4-ip">IP do PS4:</label>
                <input type="text" id="ps4-ip" placeholder="Ex: 192.168.1.50">
            </div>
            <div id="status-indicator">Verificando Servidor...</div>
        </div>

        <div id="pkg-container" class="pkg-list">
            <!-- Os jogos vão aparecer aqui -->
            <p style="text-align: center; color: #aaa;">A carregar pacotes...</p>
        </div>
    </div>

    <div id="toast" class="toast">Mensagem do sistema</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Recupera o IP guardado da última sessão
            const savedIp = localStorage.getItem('gtstore_ps4_ip');
            if (savedIp) {
                document.getElementById('ps4-ip').value = savedIp;
            }

            checkStatus();
            loadPackages();
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = isError ? '#e53935' : '#4caf50';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        async function checkStatus() {
            const indicator = document.getElementById('status-indicator');
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.online) {
                    indicator.textContent = 'Servidor Online (' + data.localAddress + ':' + data.port + ')';
                    indicator.className = 'status-online';
                }
            } catch (e) {
                indicator.textContent = 'Servidor Offline';
                indicator.className = 'status-offline';
            }
        }

        async function loadPackages() {
            const container = document.getElementById('pkg-container');
            try {
                const res = await fetch('/api/packages');
                const data = await res.json();
                
                container.innerHTML = ''; // Limpa a lista
                
                if (data.count === 0) {
                    container.innerHTML = '<p style="text-align: center;">Nenhum PKG encontrado na pasta selecionada.</p>';
                    return;
                }

                data.packages.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = 'pkg-card';
                    card.innerHTML = `
                        <div class="pkg-info">
                            <h3>${pkg.name}</h3>
                            <p>Tamanho: ${pkg.formattedSize} | Tipo: ${pkg.type}</p>
                        </div>
                        <button class="btn" id="btn-${pkg.id}" onclick="installDPI(${pkg.id})">Instalar no PS4</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: #e53935;">Erro ao carregar os pacotes.</p>';
                console.error(e);
            }
        }

        async function installDPI(pkgId) {
            const ipInput = document.getElementById('ps4-ip').value.trim();
            
            if (!ipInput) {
                showToast('Por favor, insira o IP do seu PS4.', true);
                document.getElementById('ps4-ip').focus();
                return;
            }

            // Guarda o IP para a próxima vez
            localStorage.setItem('gtstore_ps4_ip', ipInput);

            const btn = document.getElementById(`btn-${pkgId}`);
            const originalText = btn.textContent;
            btn.textContent = 'Injetando...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/install-dpi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ipInput, pkgId: pkgId })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showToast(data.message || 'Instalação iniciada! Verifique o ecrã do PS4.');
                    btn.textContent = 'Enviado ✔️';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 5000);
                } else {
                    showToast('Erro: ' + data.error, true);
                    btn.textContent = 'Falhou';
                    btn.disabled = false;
                }
            } catch (e) {
                showToast('Falha ao comunicar com o servidor GTStore.', true);
                btn.textContent = 'Erro';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
