name: Criar Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Verificar arquivos
        run: |
          ls -la gradlew
          ls -la gradlew.bat
          ls -la gradle/wrapper/

      - name: Salvar Wrapper no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper

          git commit -m "Adicionar Gradle Wrapper" || echo "Wrapper já está atualizado"

          git push



