name: Compilar APK GTSTORE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v3

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v2

    - name: Baixar binário Cloudflared (ARM64)
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
        chmod +x app/src/main/assets/cloudflared

    - name: Dar permissão ao Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v3
      with:
        name: GTSTORE-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk

