<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTStore - PS4 Installer</title>

    <style>
        :root {
            --bg-color: #101010;
            --card-bg: #1c1c1c;
            --card-bg-2: #242424;
            --primary: #0070cc;
            --primary-hover: #0088f0;
            --text-main: #ffffff;
            --text-muted: #aaa;
            --danger: #e53935;
            --success: #4caf50;
            --warning: #ff9800;
            --border: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        header {
            width: 100%;
            background: #171717;
            padding: 18px 15px;
            text-align: center;
            border-bottom: 1px solid #292929;
            box-shadow: 0 4px 15px rgba(0,0,0,.45);
        }

        .logo {
            max-width: 240px;
            max-height: 90px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .logo-fallback {
            display: none;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 22px auto 50px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #292929;
            box-shadow: 0 5px 15px rgba(0,0,0,.25);
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .config-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 250px;
        }

        label {
            font-weight: bold;
            white-space: nowrap;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: #292929;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 7px;
            transition: .2s;
        }

        .btn-scan {
            padding: 12px 16px;
            background: #444;
            color: white;
        }

        .btn-scan:hover {
            background: #555;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 11px 18px;
            font-size: 15px;
            min-width: 150px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status-badge {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 7px;
            background: #333;
            color: white;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .status-online {
            background: var(--success);
        }

        .status-offline {
            background: var(--danger);
        }

        .status-scanning {
            background: var(--warning);
            color: #111;
        }

        .manual-help {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pkg-card {
            background: var(--card-bg);
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,.2);
        }

        .pkg-info {
            min-width: 0;
        }

        .pkg-info h3 {
            margin: 0 0 6px;
            font-size: 17px;
            word-break: break-word;
        }

        .pkg-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 25px;
        }

        .error {
            color: var(--danger);
        }

        .success {
            color: var(--success);
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
            }

            .pkg-card {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }

            .input-group {
                min-width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .btn-scan {
                width: 100%;
            }

            .logo {
                max-width: 200px;
            }
        }
    </style>
</head>

<body>

<header>
    <img
        src="logo.jpg"
        alt="GTStore"
        class="logo"
        onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';"
    >

    <div id="logo-fallback" class="logo-fallback">
        GTSTORE
    </div>
</header>

<div class="container">

    <!-- CONFIGURAÇÃO DO PS4 -->
    <div class="panel">

        <div class="panel-title">
            🎮 PS4
        </div>

        <div class="config-row">

            <div class="input-group">
                <label for="ps4-ip">IP:</label>

                <input
                    type="text"
                    id="ps4-ip"
                    placeholder="Ex.: 192.168.1.100"
                    autocomplete="off"
                    inputmode="decimal"
                >
            </div>

            <button
                class="btn-scan"
                id="btn-scan"
                onclick="autoDetectPs4Ip()"
            >
                🔍 Procurar IP
            </button>

        </div>

        <div id="status-indicator" class="status-badge">
            A verificar servidor...
        </div>

        <div class="manual-help">
            Se o IP do PS4 não for encontrado automaticamente,
            digite-o acima manualmente.
        </div>

    </div>

    <!-- PACOTES -->
    <div class="panel">

        <div class="panel-title">
            📦 PKGs disponíveis
        </div>

        <div id="pkg-container" class="pkg-list">

            <div class="empty">
                A carregar pacotes...
            </div>

        </div>

    </div>

</div>

<script>

    /*
     * ============================================================
     * GTSTORE - CONFIGURAÇÃO
     * ============================================================
     */

    const STORAGE_KEY = "gtstore_ps4_ip";


    /*
     * ============================================================
     * INICIALIZAÇÃO
     * ============================================================
     */

    document.addEventListener("DOMContentLoaded", async () => {

        const savedIp = localStorage.getItem(STORAGE_KEY);

        if (savedIp) {
            document.getElementById("ps4-ip").value = savedIp;
        }

        await checkStatus();

        await loadPackages();

        /*
         * Se já existe IP salvo, não precisamos fazer
         * uma nova busca automaticamente.
         *
         * Se não existe, tentamos detectar.
         */
        if (!savedIp) {
            await autoDetectPs4Ip();
        }
    });


    /*
     * ============================================================
     * STATUS DO SERVIDOR ANDROID
     * ============================================================
     */

    async function checkStatus() {

        const indicator =
            document.getElementById("status-indicator");

        try {

            const response = await fetch(
                "/api/status",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const data = await response.json();

            if (data.online) {

                indicator.textContent =
                    "Servidor Android Online • " +
                    data.localAddress +
                    ":" +
                    data.port;

                indicator.className =
                    "status-badge status-online";

            } else {

                indicator.textContent =
                    "Servidor Android Offline";

                indicator.className =
                    "status-badge status-offline";
            }

            return data;

        } catch (error) {

            indicator.textContent =
                "Servidor Android Offline";

            indicator.className =
                "status-badge status-offline";

            return null;
        }
    }


    /*
     * ============================================================
     * DETECÇÃO DO IP
     * ============================================================
     *
     * Primeiro usamos o clientIp fornecido pelo HttpServer.
     *
     * Isso é especialmente útil quando o navegador do PS4
     * abriu diretamente a página do Android.
     *
     * Se não for possível determinar o IP dessa forma,
     * simplesmente deixamos o campo para preenchimento manual.
     */

    async function autoDetectPs4Ip() {

        const input =
            document.getElementById("ps4-ip");

        const indicator =
            document.getElementById("status-indicator");

        const button =
            document.getElementById("btn-scan");

        button.disabled = true;
        button.textContent = "🔍 Procurando...";

        indicator.textContent =
            "A tentar detectar o PS4...";

        indicator.className =
            "status-badge status-scanning";

        try {

            const response = await fetch(
                "/api/status",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error("Não foi possível consultar o servidor.");
            }

            const data = await response.json();

            /*
             * clientIp é o endereço do dispositivo que abriu
             * a conexão HTTP com o Android.
             */
            const clientIp =
                String(data.clientIp || "").trim();

            const androidIp =
                String(data.localAddress || "").trim();

            /*
             * Só aceitamos IPv4 válido.
             */
            if (
                isValidIp(clientIp) &&
                clientIp !== "127.0.0.1" &&
                clientIp !== androidIp
            ) {

                input.value = clientIp;

                localStorage.setItem(
                    STORAGE_KEY,
                    clientIp
                );

                indicator.textContent =
                    "PS4 detectado: " + clientIp;

                indicator.className =
                    "status-badge status-online";

                button.disabled = false;
                button.textContent = "🔍 Procurar IP";

                return true;
            }

            /*
             * Não foi possível detectar.
             * Não fazemos uma varredura agressiva da rede pelo
             * navegador, pois browsers podem bloquear conexões
             * para portas como 9090 por CORS/mixed-content.
             *
             * Neste caso pedimos o IP manualmente.
             */
            indicator.textContent =
                "PS4 não detectado automaticamente. Informe o IP.";

            indicator.className =
                "status-badge status-scanning";

            input.focus();

            return false;

        } catch (error) {

            indicator.textContent =
                "Não foi possível detectar o PS4. Informe o IP.";

            indicator.className =
                "status-badge status-scanning";

            input.focus();

            return false;

        } finally {

            button.disabled = false;
            button.textContent = "🔍 Procurar IP";
        }
    }


    /*
     * ============================================================
     * VALIDAÇÃO DO IP
     * ============================================================
     */

    function isValidIp(ip) {

        if (!ip) {
            return false;
        }

        const parts = ip.split(".");

        if (parts.length !== 4) {
            return false;
        }

        return parts.every(part => {

            if (part === "") {
                return false;
            }

            if (!/^\d+$/.test(part)) {
                return false;
            }

            const number = Number(part);

            return number >= 0 && number <= 255;
        });
    }


    /*
     * ============================================================
     * CARREGAR PKGs
     * ============================================================
     */

    async function loadPackages() {

        const container =
            document.getElementById("pkg-container");

        try {

            const response = await fetch(
                "/api/packages",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data = await response.json();

            container.innerHTML = "";

            if (
                !data.packages ||
                data.packages.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        Nenhum PKG encontrado na pasta configurada no Android.
                    </div>
                `;

                return;
            }

            data.packages.forEach(pkg => {

                const card =
                    document.createElement("div");

                card.className = "pkg-card";

                const info =
                    document.createElement("div");

                info.className = "pkg-info";

                const title =
                    document.createElement("h3");

                title.textContent =
                    pkg.name || "PKG";

                const size =
                    document.createElement("p");

                size.textContent =
                    "Tamanho: " +
                    (pkg.formattedSize || formatSize(pkg.size));

                info.appendChild(title);
                info.appendChild(size);

                const button =
                    document.createElement("button");

                button.className = "btn";
                button.id = "btn-" + pkg.id;
                button.textContent = "Instalar no PS4";

                button.addEventListener(
                    "click",
                    () => installDPI(pkg.id)
                );

                card.appendChild(info);
                card.appendChild(button);

                container.appendChild(card);
            });

        } catch (error) {

            container.innerHTML = `
                <div class="empty error">
                    Erro ao carregar a lista de PKGs.
                </div>
            `;
        }
    }


    /*
     * ============================================================
     * INSTALAÇÃO DPI
     * ============================================================
     */

    async function installDPI(pkgId) {

        const input =
            document.getElementById("ps4-ip");

        const ip =
            input.value.trim();

        /*
         * Se não detectou, permite informar manualmente.
         */
        if (!isValidIp(ip)) {

            alert(
                "Por favor, informe um IP válido do PS4.\n\n" +
                "Exemplo: 192.168.1.100"
            );

            input.focus();

            return;
        }

        /*
         * Salva o IP para a próxima utilização.
         */
        localStorage.setItem(
            STORAGE_KEY,
            ip
        );

        const button =
            document.getElementById(
                "btn-" + pkgId
            );

        if (!button) {
            return;
        }

        const originalText =
            button.textContent;

        button.disabled = true;
        button.textContent =
            "⏳ A enviar...";

        try {

            /*
             * NÃO alteramos o endpoint nem o formato
             * utilizado pelo HttpServer validado.
             */
            const response = await fetch(
                "/api/install-dpi",
                {
                    method: "POST",

                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        ip: ip,
                        pkgId: pkgId
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch (_) {
                throw new Error(
                    "O servidor respondeu com dados inválidos."
                );
            }

            if (data.success) {

                button.textContent =
                    "Enviado ✔";

                alert(
                    "✅ SUCESSO!\n\n" +
                    (data.message ||
                        "A instalação foi iniciada no PS4.")
                );

            } else {

                button.textContent =
                    "Falhou";

                alert(
                    "❌ ERRO\n\n" +
                    (data.error ||
                        "O servidor não conseguiu iniciar a instalação.")
                );
            }

        } catch (error) {

            button.textContent =
                "Erro";

            alert(
                "⚠️ ERRO DE COMUNICAÇÃO\n\n" +
                error.message +
                "\n\n" +
                "Verifique o IP do PS4 e se o BinLoader " +
                "está ativo na porta 9090."
            );

        } finally {

            /*
             * Depois de alguns segundos permite tentar novamente.
             */
            setTimeout(() => {

                button.textContent =
                    originalText;

                button.disabled = false;

            }, 3000);
        }
    }


    /*
     * ============================================================
     * FORMATAÇÃO
     * ============================================================
     */

    function formatSize(bytes) {

        if (!bytes || bytes <= 0) {
            return "0 B";
        }

        const units = [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

        let value = Number(bytes);
        let index = 0;

        while (
            value >= 1024 &&
            index < units.length - 1
        ) {
            value /= 1024;
            index++;
        }

        return index === 0
            ? Math.round(value) + " " + units[index]
            : value.toFixed(2) + " " + units[index];
    }

</script>

</body>
</html>
